spring.application.name=depo
spring.config.import=optional:classpath:application-secrets.properties

# Szerver
server.port=${PORT:8080}

#Adatbázis
MYSQLHOST=gateway01.eu-central-1.prod.aws.tidbcloud.com
MYSQLPORT=4000
MYSQLDATABASE=depo
MYSQLUSER=xxxxxxxxxx.root
MYSQLPASSWORD=<jelszó>
JWT_SECRET=ez_egy_nagyon_titkos_kulcs_123456789

# JWT
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&requireSSL=true&serverTimezone=UTC&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000